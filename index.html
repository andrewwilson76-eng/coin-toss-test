<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Coin Toss Throw Test 0.2</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111;color:#fff;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}main{width:min(92vw,520px);text-align:center;padding:24px 18px}h1{font-size:36px;margin:0 0 4px}p{color:#aaa}button{font-size:21px;font-weight:700;padding:16px 26px;border:0;border-radius:15px;background:#fff;color:#111;margin:8px}#status{font-size:26px;margin:22px 0;min-height:34px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#222;border-radius:14px;padding:14px}.label{color:#999;font-size:13px;text-transform:uppercase}.value{font-size:28px;font-weight:800;margin-top:5px}.meter{height:16px;background:#333;border-radius:10px;overflow:hidden;margin:14px 0}.bar{height:100%;width:0;background:#fff}small{display:block;color:#888;line-height:1.5}</style></head>
<body><main><h1>🪙 COIN TOSS</h1><p>Throw Test 0.2</p><button id="start">READY</button><button id="reset" style="display:none">RESET</button><div id="status">Press READY, then make a short wrist flick.</div>
<div class="grid"><div class="card"><div class="label">Power</div><div id="power" class="value">0%</div></div><div class="card"><div class="label">Direction</div><div id="direction" class="value">—</div></div><div class="card"><div class="label">Peak accel.</div><div id="accel" class="value">0</div></div><div class="card"><div class="label">Rotation</div><div id="rotation" class="value">—</div></div></div>
<div class="meter"><div id="bar" class="bar"></div></div><small id="detail">This version records more information about each flick so we can tune the real throw.</small></main>
<script>
let active=false,samples=[],timer=null,lastEvent=0;const $=id=>document.getElementById(id);const mag=(x,y,z)=>Math.sqrt(x*x+y*y+z*z);
function motion(e){if(!active)return;const a=e.acceleration,ag=e.accelerationIncludingGravity,r=e.rotationRate,t=performance.now();if(!ag)return;const x=ag.x||0,y=ag.y||0,z=ag.z||0,ax=a?(a.x||0):0,ay=a?(a.y||0):0,az=a?(a.z||0):0,am=mag(ax,ay,az);samples.push({t,ax,ay,az,am,rx:r?(r.alpha||0):0,ry:r?(r.beta||0):0,rz:r?(r.gamma||0):0});if(am>6&&t-lastEvent>700){lastEvent=t;finish()}}
function finish(){active=false;if(!samples.length)return;let s=samples.reduce((m,x)=>x.am>m.am?x:m,samples[0]),peak=s.am,p=Math.max(0,Math.min(100,Math.round(peak/18*100))),dir=Math.atan2(s.ay,s.ax)*180/Math.PI,rot=mag(s.rx,s.ry,s.rz);$("power").textContent=p+"%";$("bar").style.width=p+"%";$("direction").textContent=Math.round(dir)+"°";$("accel").textContent=peak.toFixed(1);$("rotation").textContent=Math.round(rot)+"°/s";$("status").textContent="THROW DETECTED!";$("detail").textContent="Captured "+samples.length+" motion samples.";$("reset").style.display="inline-block";$("start").style.display="none"}
async function permission(){if(typeof DeviceMotionEvent!=="undefined"&&typeof DeviceMotionEvent.requestPermission==="function"){const p=await DeviceMotionEvent.requestPermission();if(p!=="granted")throw Error("Motion permission was not granted.")}}
$("start").onclick=async()=>{try{await permission();samples=[];active=true;lastEvent=0;$("status").textContent="READY — FLICK!";$("power").textContent="0%";$("direction").textContent="—";$("accel").textContent="0";$("rotation").textContent="—";$("bar").style.width="0%";$("detail").textContent="Make one short, controlled flick. Keep the phone in your hand.";window.addEventListener("devicemotion",motion);clearTimeout(timer);timer=setTimeout(()=>{if(active){active=false;$("status").textContent="No clear flick detected — try again."}},5000)}catch(err){$("status").textContent="Motion permission needed.";$("detail").textContent=err.message}};
$("reset").onclick=()=>{active=false;samples=[];clearTimeout(timer);$("power").textContent="0%";$("direction").textContent="—";$("accel").textContent="0";$("rotation").textContent="—";$("bar").style.width="0%";$("status").textContent="Press READY, then make a short wrist flick.";$("detail").textContent="No motion recorded yet.";$("reset").style.display="none";$("start").style.display="inline-block"};
</script></body></html>
