<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Coin Toss 0.8</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;text-align:center}
main{max-width:520px;margin:auto;padding:14px}
h1{margin:3px;font-size:34px}.sub{color:#aaa;margin:4px 0 10px}
canvas{width:100%;background:#222;border-radius:18px}
button{font-size:21px;font-weight:bold;padding:14px 25px;border:0;border-radius:15px;margin:10px 4px}
#status{font-size:22px;font-weight:bold;min-height:30px}
#sensor{font-size:13px;color:#aaa;line-height:1.45}
</style>
</head>
<body><main>
<h1>🪙 COIN TOSS</h1>
<p class="sub">Prototype 0.8 — forward flick</p>
<canvas id="game" width="484" height="650"></canvas>
<div id="status">Press READY</div>
<button id="ready">READY</button>
<button id="again" style="display:none">THROW AGAIN</button>
<div id="sensor">Ready.</div>
</main>

<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const W=canvas.width,H=canvas.height;
let coin={x:W/2,y:H-82,vx:0,vy:0,a:0},state="idle";
let armedAt=0,lastSample=0,baseX=0,baseY=0,baseZ=0;
let baselineReady=false,forwardPeak=0,forwardSamples=0;
let lastForward=0;

function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle="#333";ctx.fillRect(18,18,W-36,H-36);
 ctx.fillStyle="#777";ctx.fillRect(18,42,W-36,18);
 ctx.fillStyle="#ddd";ctx.font="bold 16px Arial";ctx.textAlign="center";ctx.fillText("WALL",W/2,33);
 ctx.strokeStyle="#666";ctx.setLineDash([6,8]);ctx.beginPath();ctx.moveTo(W/2,60);ctx.lineTo(W/2,H-48);ctx.stroke();ctx.setLineDash([]);

 ctx.save();ctx.translate(coin.x,coin.y);ctx.rotate(coin.a);
 ctx.beginPath();ctx.arc(0,0,23,0,Math.PI*2);
 ctx.fillStyle="#c9a227";ctx.fill();ctx.lineWidth=4;ctx.strokeStyle="#f2d36b";ctx.stroke();
 ctx.fillStyle="#6f5510";ctx.font="bold 21px serif";ctx.textBaseline="middle";ctx.fillText("10p",0,0);
 ctx.restore();
 requestAnimationFrame(draw);
}

function setSensor(text){document.getElementById("sensor").innerHTML=text}

function launch(power,side){
 state="flying";
 const p=Math.max(.25,Math.min(1,power));
 const speed=10+p*12;
 coin={x:W/2,y:H-82,vx:side*speed*.45,vy:-speed,a:0};
 document.getElementById("status").textContent="🪙 THROW!";
 setSensor("Forward flick detected · power "+Math.round(p*100)+"%");
}

function motion(e){
 if(state!=="armed")return;

 const a=e.acceleration;
 const g=e.accelerationIncludingGravity;
 let ax=0,ay=0,az=0;
 if(a && (a.x!=null||a.y!=null||a.z!=null)){
   ax=a.x||0;ay=a.y||0;az=a.z||0;
 }else if(g){
   ax=g.x||0;ay=g.y||0;az=g.z||0;
 }else return;

 const now=performance.now();
 if(now-armedAt<500){
   if(!baselineReady){
     baseX=ax;baseY=ay;baseZ=az;baselineReady=true;
   }else{
     baseX=baseX*.9+ax*.1;
     baseY=baseY*.9+ay*.1;
     baseZ=baseZ*.9+az*.1;
   }
   return;
 }

 const dx=ax-baseX,dy=ay-baseY,dz=az-baseZ;
 const horizontal=Math.hypot(dx,dy);
 const magnitude=Math.hypot(dx,dy,dz);

 /*
  Forward flick filter:
  We deliberately require a short sequence rather than a single movement.
  The first movement arms the detector; the following stronger movement is
  treated as the throw. This greatly reduces back-swing false triggers.
 */
 if(magnitude>0.45){
   forwardSamples++;
   forwardPeak=Math.max(forwardPeak,magnitude);

   // Require two nearby motion samples and a stronger second movement.
   if(forwardSamples>=2 && now-lastForward>650){
     // Prefer movement in the phone's screen plane.
     let side=dx/4;
     side=Math.max(-1,Math.min(1,side));

     // If the phone's main movement is on the other screen axis,
     // still produce a controlled direction rather than zero.
     if(Math.abs(side)<.18) side=dx>=0?.22:-.22;

     const power=Math.max(.25,Math.min(1,forwardPeak/5));
     lastForward=now;
     launch(power,side);
   }
 }else{
   // A quiet sample resets the short gesture.
   forwardSamples=0;
   forwardPeak=0;
 }
}

function update(){
 if(state==="flying"){
   coin.x+=coin.vx;
   coin.y+=coin.vy;
   coin.vy+=0.17;
   coin.vx*=0.995;
   coin.a+=0.075;

   // Side boundaries.
   if(coin.x<42){coin.x=42;coin.vx=Math.abs(coin.vx)*.3}
   if(coin.x>W-42){coin.x=W-42;coin.vx=-Math.abs(coin.vx)*.3}

   // THE WALL: stop the coin there. No bounce and no return journey.
   if(coin.y-23<=60){
     coin.y=83;
     coin.vx*=0.15;
     coin.vy=0;
     state="stopped";
     document.getElementById("status").textContent="🪙 COIN AT WALL";
     setSensor("Throw complete · coin is staying at the wall.");
     document.getElementById("again").style.display="inline-block";
   }
 }
 requestAnimationFrame(update);
}

document.getElementById("ready").onclick=async()=>{
 try{
   if(typeof DeviceMotionEvent!=="undefined" &&
      typeof DeviceMotionEvent.requestPermission==="function"){
     const p=await DeviceMotionEvent.requestPermission();
     if(p!=="granted")throw Error("Motion permission was not granted.");
   }
   state="armed";
   armedAt=performance.now();
   baselineReady=false;
   forwardPeak=0;
   forwardSamples=0;
   lastForward=0;
   document.getElementById("ready").style.display="none";
   document.getElementById("status").textContent="READY — HOLD STILL";
   setSensor("Hold still for half a second, then make ONE forward flick.");
   setTimeout(()=>{
     if(state==="armed"){
       state="idle";
       document.getElementById("ready").style.display="inline-block";
       document.getElementById("status").textContent="No throw detected";
       setSensor("Tap READY and try one clear forward flick.");
     }
   },6000);
 }catch(e){
   document.getElementById("status").textContent="Motion access not available";
   setSensor(e.message);
 }
};

document.getElementById("again").onclick=()=>{
 coin={x:W/2,y:H-82,vx:0,vy:0,a:0};
 state="idle";
 document.getElementById("again").style.display="none";
 document.getElementById("ready").style.display="inline-block";
 document.getElementById("status").textContent="Press READY";
 setSensor("Ready.");
};

window.addEventListener("devicemotion",motion);
requestAnimationFrame(draw);
requestAnimationFrame(update);
</script>
</body>
</html>
