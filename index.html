<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Stack It</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17132a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center;min-height:100vh}
main{width:min(100vw,520px);padding:14px;text-align:center}
h1{font-size:38px;margin:4px 0}.sub{color:#bbb;margin:0 0 10px}
canvas{width:100%;height:auto;border-radius:22px;display:block;background:#272044;touch-action:manipulation}
button{font-size:22px;font-weight:800;border:0;border-radius:16px;padding:14px 30px;margin:12px 0;background:#fff;color:#17132a}
#status{font-size:23px;font-weight:800;min-height:30px}
#score{font-size:18px;color:#ddd}
</style>
</head>
<body>
<main>
<h1>🧱 STACK IT</h1>
<p class="sub">Tap to drop the block</p>
<canvas id="game" width="484" height="650"></canvas>
<div id="status">READY?</div>
<div id="score">Score: 0</div>
<button id="play">PLAY</button>
</main>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d"),W=c.width,H=c.height;
const colours=["#ff4d6d","#ffb703","#00d4ff","#7cff6b","#b66cff","#ff7a00"];
let state="menu",score=0,level=1,blocks=[],current=null,dir=1,last=0,baseSpeed=2.8;
const floorY=585;

function rnd(n){return Math.floor(Math.random()*n)}
function newBlock(){
 const width=Math.max(62,125-(level-1)*6);
 current={x:45,y:100,w:width,h:34,vy:0,colour:colours[(blocks.length+level)%colours.length]};
 dir=1;
}
function start(){
 state="playing";score=0;level=1;blocks=[];
 blocks.push({x:W/2-70,y:floorY-28,w:140,h:28,colour:"#ffffff"});
 newBlock();updateUI();
}
function updateUI(){document.getElementById("score").textContent="Score: "+score+"  •  Level "+level}
function draw(){
 ctx.clearRect(0,0,W,H);
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#3b2b72");g.addColorStop(1,"#17132a");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle="#f4f1ff";ctx.font="bold 18px sans-serif";ctx.textAlign="center";ctx.fillText("STACK",W/2,45);
 ctx.fillStyle="#4b4268";ctx.fillRect(25,floorY,W-50,10);
 for(const b of blocks){drawBlock(b)}
 if(current&&state==="playing")drawBlock(current);
 if(state==="gameover"){
   ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(0,0,W,H);
   ctx.fillStyle="#fff";ctx.font="bold 40px sans-serif";ctx.fillText("STACK OVER!",W/2,260);
   ctx.font="bold 28px sans-serif";ctx.fillText("Score "+score,W/2,310);
   ctx.font="18px sans-serif";ctx.fillText("Tap PLAY to try again",W/2,350);
 }
 requestAnimationFrame(draw);
}
function drawBlock(b){
 ctx.save();
 ctx.fillStyle=b.colour;
 ctx.beginPath();
 ctx.roundRect(b.x,b.y,b.w,b.h,8);ctx.fill();
 ctx.fillStyle="rgba(255,255,255,.25)";
 ctx.fillRect(b.x+7,b.y+6,b.w-14,6);
 ctx.restore();
}
function overlap(a,b){return Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x))}
function drop(){
 if(state!=="playing"||!current)return;
 const below=blocks[blocks.length-1];
 const o=overlap(current,below);
 if(o<20){state="gameover";current=null;return}
 current.x=Math.max(current.x,below.x);
 current.x=Math.min(current.x,below.x+below.w-o);
 current.y=below.y-current.h;
 blocks.push({...current});
 score+=Math.max(1,Math.round(o/10));
 if(score>0&&score%50<5)level=Math.min(12,level+1);
 newBlock();updateUI();
}
function tick(){
 if(state==="playing"&&current){
   const speed=baseSpeed+(level-1)*0.45;
   current.x+=speed*dir;
   if(current.x<=25){current.x=25;dir=1}
   if(current.x+current.w>=W-25){current.x=W-25-current.w;dir=-1}
 }
 requestAnimationFrame(tick);
}
c.addEventListener("pointerdown",drop);
document.getElementById("play").onclick=start;
draw();tick();
</script>
</body>
</html>
