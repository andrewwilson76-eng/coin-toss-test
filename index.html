<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Stuff the Jar 0.1</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#6f54da,#2c1c65 52%,#160d39);color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center}.game{width:min(100%,520px);padding:10px;text-align:center}h1{font-size:38px;margin:5px 0 2px;text-shadow:0 4px #5637b3}.sub{margin:5px 0 9px;color:#e7e2ff;font-weight:700}canvas{width:100%;height:auto;display:block;border:5px solid #ffffffa8;border-radius:25px;background:#6fd8ff;box-shadow:0 18px 45px #08031e7a;touch-action:manipulation}.status{min-height:30px;margin-top:7px;color:#ffe45c;font-size:21px;font-weight:900}.hud{font-weight:800;color:#eee9ff}button{margin:9px;padding:13px 42px;border:0;border-radius:17px;background:#fff;color:#29165d;font-size:22px;font-weight:900;box-shadow:0 6px #8e7bd3}@media(max-height:780px){h1{font-size:30px}.sub{margin:2px 0 5px}canvas{max-height:72vh;object-fit:contain}.status{font-size:18px}}
</style></head><body><main class="game"><h1>🧸 STUFF THE JAR</h1><p class="sub">Drop the toys • Pack them tight • Don't overflow!</p><canvas id="c" width="484" height="650"></canvas><div class="status" id="status">READY TO FILL?</div><div class="hud" id="hud">Toys: 0 • Best: 0</div><button id="play">PLAY</button></main><script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=484,H=650,RIM=116,FLOOR=590,GROUND=624;
const TYPES=[['ball','#ff4f7b',21],['teddy','#c47b3e',25],['cube','#7c5cff',24],['duck','#ffd43b',22],['car','#26a7ff',24],['block','#35c96f',22]];
let toys=[],cur=null,state='menu',dir=1,spillAt=0,best=Number(localStorage.getItem('stuffJarBest')||0),raf=0;
const status=document.getElementById('status'),hud=document.getElementById('hud');
function ui(){hud.textContent=`Toys: ${toys.length} • Best: ${best}`}
function spawn(){let p=TYPES[Math.floor(Math.random()*TYPES.length)];cur={kind:p[0],color:p[1],r:p[2],x:75,y:65,vx:0,vy:0,a:0,av:0,falling:false};dir=Math.random()<.5?-1:1}
function start(){toys=[];cur=null;state='playing';spawn();status.textContent='TAP TO DROP';ui()}
function drop(){if(state!=='playing'||!cur||cur.falling)return;cur.falling=true;cur.av=(Math.random()-.5)*.08;status.textContent='SQUEEZE IT IN!'}
function toy(t){x.save();x.translate(t.x,t.y);x.rotate(t.a);if(t.kind==='ball'){x.fillStyle=t.color;x.beginPath();x.arc(0,0,t.r,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=4;x.beginPath();x.arc(-5,-3,t.r*.64,-.8,.8);x.stroke()}else if(t.kind==='cube'){x.fillStyle='#6c55e8';x.beginPath();x.roundRect(-t.r,-t.r,t.r*2,t.r*2,7);x.fill();['#ff5b76','#ffe34f','#4ade80','#45b8ff'].forEach((q,i)=>{x.fillStyle=q;x.beginPath();x.arc(Math.cos(i*Math.PI/2)*12,Math.sin(i*Math.PI/2)*12,7,0,7);x.fill()});x.fillStyle='#fff';x.font='900 19px Arial';x.textAlign='center';x.fillText('★',0,7)}else if(t.kind==='teddy'){x.fillStyle=t.color;x.beginPath();x.arc(-15,-16,10,0,7);x.arc(15,-16,10,0,7);x.fill();x.beginPath();x.arc(0,-5,20,0,7);x.arc(0,18,19,0,7);x.fill();x.fillStyle='#f0bd7b';x.beginPath();x.arc(0,0,9,0,7);x.fill();x.fillStyle='#2c1b16';x.beginPath();x.arc(-7,-8,2.5,0,7);x.arc(7,-8,2.5,0,7);x.arc(0,-1,3,0,7);x.fill()}else if(t.kind==='duck'){x.fillStyle=t.color;x.beginPath();x.arc(-3,6,19,0,7);x.arc(9,-12,13,0,7);x.fill();x.fillStyle='#ff8a28';x.beginPath();x.moveTo(18,-11);x.lineTo(32,-5);x.lineTo(18,-2);x.fill();x.fillStyle='#222';x.beginPath();x.arc(12,-15,2.5,0,7);x.fill()}else if(t.kind==='car'){x.fillStyle=t.color;x.beginPath();x.roundRect(-25,-12,50,25,7);x.fill();x.fillStyle='#bfeaff';x.fillRect(-10,-20,22,11);x.fillStyle='#222';x.beginPath();x.arc(-15,15,7,0,7);x.arc(16,15,7,0,7);x.fill()}else{x.fillStyle=t.color;x.beginPath();x.roundRect(-t.r,-18,t.r*2,36,5);x.fill();x.fillStyle='#fff';x.font='900 24px Arial';x.textAlign='center';x.fillText('A',0,8)}x.restore()}
function park(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#55c8ff');g.addColorStop(.7,'#b9efff');g.addColorStop(1,'#f3fdff');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#ffe45c';x.beginPath();x.arc(405,83,39,0,7);x.fill();function cloud(a,b,s){x.fillStyle='#ffffffeb';x.beginPath();x.arc(a,b,18*s,0,7);x.arc(a+22*s,b-8*s,24*s,0,7);x.arc(a+48*s,b,19*s,0,7);x.fill()}cloud(48,100,.9);cloud(238,145,.65);x.fillStyle='#74d65c';x.beginPath();x.arc(80,540,205,Math.PI,0);x.arc(355,540,245,Math.PI,0);x.fill();x.fillStyle='#4fbd4b';x.fillRect(0,505,W,145);x.fillStyle='#8b5a2b';x.fillRect(41,390,14,95);x.fillRect(425,380,15,105);x.fillStyle='#258f45';x.beginPath();x.arc(48,375,40,0,7);x.arc(432,365,44,0,7);x.fill();x.fillStyle='#98724c';x.fillRect(0,GROUND,W,H-GROUND);x.fillStyle='#dcf8ff50';x.beginPath();x.moveTo(62,RIM);x.lineTo(92,FLOOR);x.quadraticCurveTo(W/2,628,W-92,FLOOR);x.lineTo(W-62,RIM);x.closePath();x.fill();x.strokeStyle='#ffffffe6';x.lineWidth=9;x.beginPath();x.moveTo(62,RIM);x.lineTo(92,FLOOR);x.quadraticCurveTo(W/2,628,W-92,FLOOR);x.lineTo(W-62,RIM);x.stroke();x.strokeStyle='#8bdff5';x.lineWidth=5;x.beginPath();x.moveTo(55,RIM);x.lineTo(W-55,RIM);x.stroke()}
function loop(now){if(state==='playing'&&cur&&!cur.falling){cur.x+=(2.6+Math.min(2,toys.length*.035))*dir;if(cur.x<45){cur.x=45;dir=1}if(cur.x>W-45){cur.x=W-45;dir=-1}}
if(state==='playing'&&cur&&cur.falling){cur.vy+=.42;cur.y+=cur.vy;cur.a+=cur.av;let left=72+Math.max(0,(cur.y-400)*.045),right=W-left;if(cur.x-cur.r<left){cur.x=left+cur.r;cur.av*=-.7}if(cur.x+cur.r>right){cur.x=right-cur.r;cur.av*=-.7}let land=false;if(cur.y+cur.r>=FLOOR){cur.y=FLOOR-cur.r;land=true}for(let b of toys){let dx=cur.x-b.x,dy=cur.y-b.y,d=Math.hypot(dx,dy),m=(cur.r+b.r)*.88;if(d<m&&cur.vy>0&&dy<0){cur.y=b.y-Math.sqrt(Math.max(0,m*m-dx*dx));land=true;break}}if(land){cur.falling=false;cur.vy=0;toys.push(cur);let t=cur;cur=null;if(t.y-t.r<RIM+5&&toys.length>6){state='spilling';spillAt=now;status.textContent='TOY AVALANCHE!';toys.forEach((q,i)=>{q.vx=(q.x-W/2)*.018+Math.sin(i*2.1)*1.8;q.vy=-Math.random()*2;q.av=(Math.random()-.5)*.12})}else{spawn();status.textContent='NICE! KEEP FILLING';ui()}}}
if(state==='spilling'){toys.forEach(t=>{t.vy+=.38;t.x+=t.vx;t.y+=t.vy;t.a+=t.av;if(t.y+t.r>GROUND){t.y=GROUND-t.r;t.vy*=-.25;t.vx*=.82}if(t.x-t.r<4){t.x=t.r+4;t.vx=Math.abs(t.vx)*.6}if(t.x+t.r>W-4){t.x=W-4-t.r;t.vx=-Math.abs(t.vx)*.6}});if(now-spillAt>3000){state='gameover';if(toys.length>best){best=toys.length;localStorage.setItem('stuffJarBest',best);status.textContent='🏆 NEW BEST!'}else status.textContent='JAR OVERFLOWED!';ui()}}
park();toys.forEach(toy);if(cur)toy(cur);if(state==='gameover'){x.fillStyle='#201245b8';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';x.font='900 42px Arial';x.fillText('JAR OVERFLOW!',W/2,260);x.font='800 26px Arial';x.fillText(`${toys.length} toys packed`,W/2,310);x.font='20px Arial';x.fillText(`Best: ${best}`,W/2,350)}raf=requestAnimationFrame(loop)}
document.getElementById('play').onclick=start;c.addEventListener('pointerdown',drop);ui();raf=requestAnimationFrame(loop);
</script></body></html>
