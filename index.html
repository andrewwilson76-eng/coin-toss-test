<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Stuff the Jar 0.8</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#6f54da,#2c1c65 52%,#160d39);color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center}.game{width:min(100%,520px);padding:10px;text-align:center}h1{font-size:38px;margin:5px 0 2px;text-shadow:0 4px #5637b3}.sub{margin:5px 0 9px;color:#e7e2ff;font-weight:700}canvas{width:100%;height:auto;display:block;border:5px solid #ffffffa8;border-radius:25px;background:#6fd8ff;box-shadow:0 18px 45px #08031e7a;touch-action:manipulation}.status{min-height:30px;margin-top:7px;color:#ffe45c;font-size:21px;font-weight:900}.hud{font-weight:800;color:#eee9ff}button{margin:9px;padding:13px 42px;border:0;border-radius:17px;background:#fff;color:#29165d;font-size:22px;font-weight:900;box-shadow:0 6px #8e7bd3}@media(max-height:780px){h1{font-size:30px}.sub{margin:2px 0 5px}canvas{max-height:72vh;object-fit:contain}.status{font-size:18px}}
</style></head><body><main class="game"><h1>🧸 STUFF THE JAR</h1><p class="sub">Drop toys • Match 3 • Keep the jar from overflowing!</p><canvas id="c" width="484" height="650"></canvas><div class="status" id="status">READY TO FILL?</div><div class="hud" id="hud">Dropped: 0 • In jar: 0 • Best: 0</div><button id="play">PLAY</button></main><script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=484,H=650,RIM=116,FLOOR=600,GROUND=624;
const jarLeft=y=>62+Math.max(0,Math.min(1,(y-RIM)/(FLOOR-RIM)))*30,jarBottom=_px=>FLOOR;
const TYPES=[['ball','#ff4f7b',27],['teddy','#c47b3e',32],['cube','#7c5cff',31],['duck','#ffd43b',29],['car','#26a7ff',31],['block','#35c96f',29],['robot','#45b8d8',30],['drum','#f05b57',29],['star','#ffb82e',30],['boat','#ef6f9b',30]],BASE={ball:21,teddy:25,cube:24,duck:22,car:24,block:22,robot:23,drum:22,star:23,boat:23};
let toys=[],particles=[],cur=null,state='menu',dir=1,spillAt=0,clearAt=0,dropped=0,best=Number(localStorage.getItem('stuffJarBest')||0),raf=0;
let audio=null,musicTimer=null,noteStep=0;const melody=[523.25,659.25,783.99,659.25,587.33,698.46,880,698.46,523.25,659.25,783.99,1046.5];
function music(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();if(musicTimer)clearInterval(musicTimer);noteStep=0;const play=()=>{let o=audio.createOscillator(),g=audio.createGain(),n=audio.currentTime;o.type='triangle';o.frequency.value=melody[noteStep++%melody.length];g.gain.setValueAtTime(.045,n);g.gain.exponentialRampToValueAtTime(.001,n+.16);o.connect(g).connect(audio.destination);o.start(n);o.stop(n+.17)};play();musicTimer=setInterval(play,190)}catch(e){}}
const status=document.getElementById('status'),hud=document.getElementById('hud');
function ui(){hud.textContent=`Dropped: ${dropped} • In jar: ${toys.length} • Best: ${best} • Speed: ${1+Math.floor(dropped/20)}`}
function spawn(){let p=TYPES[Math.floor(Math.random()*TYPES.length)];if(toys.length&&Math.random()<.32){let n=toys[Math.floor(Math.random()*toys.length)];p=TYPES.find(q=>q[0]===n.kind)||p}cur={kind:p[0],color:p[1],r:p[2],x:75,y:65,vx:0,vy:0,a:0,av:0,falling:false};dir=Math.random()<.5?-1:1}
function start(){music();toys=[];particles=[];cur=null;dropped=0;state='playing';spawn();status.textContent='MATCH 3 TO CLEAR!';ui()}
function drop(){if(state!=='playing'||!cur||cur.falling)return;cur.falling=true;cur.vx=(Math.random()-.5)*.18;cur.av=cur.kind==='duck'?0:(Math.random()-.5)*.08;if(cur.kind==='duck')cur.a=0;cur.settle=0;status.textContent='ROLL IT INTO PLACE!'}
function toy(t){let b=BASE[t.kind],s=t.r/b,p=t.pop??1;x.save();x.translate(t.x,t.y);x.rotate(t.a);x.scale(s*p,s*p);x.shadowColor='#21134b55';x.shadowBlur=5;x.shadowOffsetY=3;x.strokeStyle='#302354';x.lineWidth=3;
if(t.kind==='ball'){x.fillStyle=t.color;x.beginPath();x.arc(0,0,b,0,7);x.fill();x.stroke();x.strokeStyle='#fff';x.lineWidth=4;x.beginPath();x.arc(-5,-3,b*.64,-.8,.8);x.stroke()}
else if(t.kind==='cube'){x.fillStyle='#6c55e8';x.beginPath();x.roundRect(-b,-b,b*2,b*2,7);x.fill();x.stroke();['#ff5b76','#ffe34f','#4ade80','#45b8ff'].forEach((q,i)=>{x.fillStyle=q;x.beginPath();x.arc(Math.cos(i*Math.PI/2)*12,Math.sin(i*Math.PI/2)*12,7,0,7);x.fill()});x.fillStyle='#fff';x.font='900 19px Arial';x.textAlign='center';x.fillText('★',0,7)}
else if(t.kind==='teddy'){x.fillStyle=t.color;x.beginPath();x.arc(-15,-16,10,0,7);x.arc(15,-16,10,0,7);x.fill();x.stroke();x.beginPath();x.arc(0,-5,20,0,7);x.arc(0,18,19,0,7);x.fill();x.stroke();x.fillStyle='#f0bd7b';x.beginPath();x.arc(0,0,9,0,7);x.fill();x.fillStyle='#2c1b16';x.beginPath();x.arc(-7,-8,2.5,0,7);x.arc(7,-8,2.5,0,7);x.arc(0,-1,3,0,7);x.fill()}
else if(t.kind==='duck'){x.fillStyle=t.color;x.beginPath();x.arc(-3,6,19,0,7);x.arc(9,-12,13,0,7);x.fill();x.stroke();x.fillStyle='#ff8a28';x.beginPath();x.moveTo(18,-11);x.lineTo(32,-5);x.lineTo(18,-2);x.closePath();x.fill();x.stroke();x.fillStyle='#222';x.beginPath();x.arc(12,-15,2.5,0,7);x.fill()}
else if(t.kind==='car'){x.fillStyle=t.color;x.beginPath();x.roundRect(-25,-12,50,25,7);x.fill();x.stroke();x.fillStyle='#bfeaff';x.fillRect(-10,-20,22,11);x.fillStyle='#222';x.beginPath();x.arc(-15,15,7,0,7);x.arc(16,15,7,0,7);x.fill()}
else if(t.kind==='robot'){x.fillStyle=t.color;x.beginPath();x.roundRect(-18,-22,36,34,6);x.fill();x.stroke();x.beginPath();x.moveTo(0,-22);x.lineTo(0,-30);x.stroke();x.fillStyle='#ff5b76';x.beginPath();x.arc(0,-32,4,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(-7,-10,4,0,7);x.arc(7,-10,4,0,7);x.fill();x.fillStyle='#302354';x.fillRect(-8,2,16,4)}
else if(t.kind==='drum'){x.fillStyle=t.color;x.beginPath();x.roundRect(-21,-19,42,38,6);x.fill();x.stroke();x.fillStyle='#fff5cf';x.beginPath();x.ellipse(0,-18,21,7,0,0,7);x.fill();x.stroke();x.strokeStyle='#ffe45c';x.lineWidth=4;x.beginPath();x.moveTo(-17,-10);x.lineTo(17,10);x.moveTo(17,-10);x.lineTo(-17,10);x.stroke()}
else if(t.kind==='star'){x.fillStyle=t.color;x.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?b*.45:b,px=Math.cos(a)*r,py=Math.sin(a)*r;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.fill();x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(-7,-2,2.5,0,7);x.arc(7,-2,2.5,0,7);x.fill()}
else if(t.kind==='boat'){x.fillStyle=t.color;x.beginPath();x.moveTo(-24,4);x.lineTo(24,4);x.lineTo(15,19);x.lineTo(-15,19);x.closePath();x.fill();x.stroke();x.beginPath();x.moveTo(0,4);x.lineTo(0,-25);x.stroke();x.fillStyle='#ffe45c';x.beginPath();x.moveTo(2,-23);x.lineTo(21,-4);x.lineTo(2,-4);x.closePath();x.fill();x.stroke()}
else{x.fillStyle=t.color;x.beginPath();x.roundRect(-b,-18,b*2,36,5);x.fill();x.stroke();x.fillStyle='#fff';x.font='900 24px Arial';x.textAlign='center';x.fillText('A',0,8)}x.restore()}
function cluster(start){let kind=toys[start].kind,seen=new Set([start]),q=[start];while(q.length){let i=q.shift();for(let j=0;j<toys.length;j++){if(seen.has(j)||toys[j].kind!==kind)continue;let a=toys[i],b=toys[j];if(Math.hypot(a.x-b.x,a.y-b.y)<(a.r+b.r)*1.16){seen.add(j);q.push(j)}}}return [...seen]}
function planDrop(){let placed=[];[...toys].sort((a,b)=>b.y-a.y).forEach(t=>{let target=FLOOR-t.r;placed.forEach(q=>{let dx=Math.abs(t.x-q.x),gap=(t.r+q.r)*.9;if(dx<gap)target=Math.min(target,(q.targetY??q.y)-Math.sqrt(Math.max(0,gap*gap-dx*dx)))});t.targetY=Math.max(t.y,target);t.dropVy=0;placed.push(t)})}
function park(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#55c8ff');g.addColorStop(.7,'#b9efff');g.addColorStop(1,'#f3fdff');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#ffe45c';x.beginPath();x.arc(405,83,39,0,7);x.fill();function cloud(a,b,s){x.fillStyle='#ffffffeb';x.beginPath();x.arc(a,b,18*s,0,7);x.arc(a+22*s,b-8*s,24*s,0,7);x.arc(a+48*s,b,19*s,0,7);x.fill()}cloud(48,100,.9);cloud(238,145,.65);x.fillStyle='#74d65c';x.beginPath();x.arc(80,540,205,Math.PI,0);x.arc(355,540,245,Math.PI,0);x.fill();x.fillStyle='#4fbd4b';x.fillRect(0,505,W,145);x.fillStyle='#8b5a2b';x.fillRect(41,390,14,95);x.fillRect(425,380,15,105);x.fillStyle='#258f45';x.beginPath();x.arc(48,375,40,0,7);x.arc(432,365,44,0,7);x.fill();x.fillStyle='#98724c';x.fillRect(0,GROUND,W,H-GROUND);x.fillStyle='#dcf8ff50';x.beginPath();x.moveTo(62,RIM);x.lineTo(88,FLOOR-12);x.quadraticCurveTo(90,FLOOR,104,FLOOR);x.lineTo(W-104,FLOOR);x.quadraticCurveTo(W-90,FLOOR,W-88,FLOOR-12);x.lineTo(W-62,RIM);x.closePath();x.fill();x.strokeStyle='#ffffffe6';x.lineWidth=9;x.lineJoin='round';x.beginPath();x.moveTo(62,RIM);x.lineTo(88,FLOOR-12);x.quadraticCurveTo(90,FLOOR,104,FLOOR);x.lineTo(W-104,FLOOR);x.quadraticCurveTo(W-90,FLOOR,W-88,FLOOR-12);x.lineTo(W-62,RIM);x.stroke();x.strokeStyle='#8bdff5';x.lineWidth=5;x.beginPath();x.moveTo(55,RIM);x.lineTo(W-55,RIM);x.stroke()}
function spill(now){state='spilling';spillAt=now;status.textContent='TOY AVALANCHE!';toys.forEach((q,i)=>{q.vx=(q.x-W/2)*.018+Math.sin(i*2.1)*1.8;q.vy=-Math.random()*2;q.av=(Math.random()-.5)*.12})}
function loop(now){if(state==='playing'&&cur&&!cur.falling){cur.x+=Math.min(6.4,3.25+Math.floor(dropped/20)*.5)*dir;if(cur.x<45){cur.x=45;dir=1}if(cur.x>W-45){cur.x=W-45;dir=-1}}
if(state==='playing'&&cur&&cur.falling){let t=cur;t.vy+=.58;t.x+=t.vx;t.y+=t.vy;if(t.kind==='duck'){t.a=0;t.av=0}else t.a+=t.av;t.vx*=.99;t.av*=.985;let contact=false,left=jarLeft(t.y),right=W-left;if(t.x-t.r<left){t.x=left+t.r;t.vx=Math.abs(t.vx)*.48+.12;if(t.kind!=='duck')t.av+=.025;contact=true}if(t.x+t.r>right){t.x=right-t.r;t.vx=-Math.abs(t.vx)*.48-.12;if(t.kind!=='duck')t.av-=.025;contact=true}let bottom=jarBottom(t.x);if(t.y+t.r>=bottom){t.y=bottom-t.r;t.vy=-Math.abs(t.vy)*.1;t.vx*=.76;t.av*=.62;contact=true}for(let b of toys){let dx=t.x-b.x,dy=t.y-b.y,d=Math.hypot(dx,dy),m=(t.r+b.r)*.90;if(d>=m)continue;if(d<.01){dx=.01;dy=-1;d=1}let nx=dx/d,ny=dy/d,o=m-d;t.x+=nx*o;t.y+=ny*o;let vn=t.vx*nx+t.vy*ny;if(vn<0){t.vx-=1.18*vn*nx;t.vy-=1.18*vn*ny}let tan=-t.vx*ny+t.vy*nx;t.vx+=-ny*tan*.025;t.vy+=nx*tan*.025;if(t.kind!=='duck')t.av+=tan*.004;if(Math.abs(nx)<.12)t.vx+=(t.a>=0?1:-1)*.10;contact=true}
let instant=false;if(contact){toys.push(t);let hit=cluster(toys.length-1);if(hit.length>=3){instant=true;t.falling=false;t.vx=t.vy=0;cur=null;dropped++;state='clearing';clearAt=now;status.textContent=`✨ ${hit.length} INSTANT MATCH!`;hit.forEach(i=>{let q=toys[i];q.pop=1;for(let p=0;p<12;p++)particles.push({x:q.x,y:q.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:1,color:q.color})});ui()}else toys.pop()}
t.settle=contact&&Math.abs(t.vy)<1&&Math.abs(t.vx)<.65?(t.settle||0)+1:0;if(!instant&&t.settle>8){t.falling=false;t.vx=0;t.vy=0;toys.push(t);cur=null;dropped++;let m=cluster(toys.length-1);if(m.length>=3){state='clearing';clearAt=now;status.textContent=`✨ ${m.length} TOY MATCH!`;m.forEach(i=>{let q=toys[i];q.pop=1;for(let p=0;p<12;p++)particles.push({x:q.x,y:q.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:1,color:q.color})})}else if(t.y-t.r<RIM+5&&toys.length>6)spill(now);else{spawn();status.textContent=dropped%20===0?`⚡ SPEED ${1+Math.floor(dropped/20)}!`:'NICE! FIND A MATCH';ui()}}}
if(state==='clearing'){toys.forEach(t=>{if(t.pop!==undefined)t.pop=Math.max(0,t.pop-.075)});if(now-clearAt>430){toys=toys.filter(t=>t.pop===undefined);ui();planDrop();state='settling';status.textContent='TOYS DROPPING!'}}
if(state==='settling'){let moving=false;toys.forEach(t=>{let target=t.targetY??t.y;if(t.y<target-.4){t.dropVy=(t.dropVy||0)+.58;t.y=Math.min(target,t.y+t.dropVy);moving=true}else{t.y=target;t.dropVy=0}});if(!moving){toys.forEach(t=>{delete t.targetY;delete t.dropVy});if(toys.some(t=>t.y-t.r<RIM+5)&&toys.length>6)spill(now);else{state='playing';spawn();status.textContent=dropped%20===0?`⚡ SPEED ${1+Math.floor(dropped/20)}!`:'POP! MORE ROOM!'}}}
if(state==='spilling'){toys.forEach(t=>{t.vy+=.38;t.x+=t.vx;t.y+=t.vy;t.a+=t.av;if(t.y+t.r>GROUND){t.y=GROUND-t.r;t.vy*=-.25;t.vx*=.82}if(t.x-t.r<4){t.x=t.r+4;t.vx=Math.abs(t.vx)*.6}if(t.x+t.r>W-4){t.x=W-4-t.r;t.vx=-Math.abs(t.vx)*.6}});if(now-spillAt>3000){state='gameover';if(dropped>best){best=dropped;localStorage.setItem('stuffJarBest',best);status.textContent='🏆 NEW BEST!'}else status.textContent='JAR OVERFLOWED!';ui()}}
particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life-=.035});particles=particles.filter(p=>p.life>0);park();toys.forEach(toy);if(cur)toy(cur);particles.forEach(p=>{x.globalAlpha=p.life;x.fillStyle=p.color;x.beginPath();x.arc(p.x,p.y,4+p.life*3,0,7);x.fill()});x.globalAlpha=1;if(state==='gameover'){x.fillStyle='#201245b8';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';x.font='900 42px Arial';x.fillText('JAR OVERFLOW!',W/2,260);x.font='800 26px Arial';x.fillText(`${dropped} toys dropped`,W/2,310);x.font='20px Arial';x.fillText(`Best: ${best}`,W/2,350)}raf=requestAnimationFrame(loop)}
document.getElementById('play').onclick=start;c.addEventListener('pointerdown',drop);ui();raf=requestAnimationFrame(loop);
</script></body></html>
